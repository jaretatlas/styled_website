<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jaret Martin's contact page with a name, email, phone, and newsletter subscription form.">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>Jaret Martin | Contact Me</title>
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="interests.html">Interests</a>
            <a href="gallery.html">Media Gallery</a>
            <a href="contact.html" aria-current="page">Contact Me</a>
        </nav>
    </header>

    <main>
        <div class="columns">
            <section>
                <h2>Contact Form</h2>
                <form action="contact.html" method="get">
                    <p>
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </p>
                    <p>
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </p>
                    <p>
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" name="phone">
                    </p>
                    <p class="checkbox-row">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                        <label for="subscribe">Subscribe to my newsletter</label>
                    </p>
                    <button type="submit">Submit</button>
                </form>
            </section>
            <section>
                <h2>Stay in Touch</h2>
                <p>You can also find me using the social links below.</p>
                <img src="images/mom.jpg" alt="My mom and me standing beside a staircase">
            </section>
        </div>
    </main>

    <footer>
        <p>Connect with me:</p>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/jaretmartin/" aria-label="LinkedIn"><img src="images/linkedin.svg" alt=""></a>
            <a href="https://github.com/jaretatlas" aria-label="GitHub"><img src="images/github.svg" alt=""></a>
            <a href="https://www.facebook.com/jaret.martin/" aria-label="Facebook"><img src="images/facebook.svg" alt=""></a>
        </div>
    </footer>
</body>
</html>
